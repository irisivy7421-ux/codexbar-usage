name: Build CodexBar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app
        run: ./scripts/package_app.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: CodexBar.app
          path: dist/CodexBar.app
          if-no-files-found: error
